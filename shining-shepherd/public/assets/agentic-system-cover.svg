<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Agentic System: the model changes, the workspace stays</title>
  <desc id="desc">Claude, Codex, Qwen and reviewers connected to one shared workspace of rules, memory and tools. Alexander approves what ships.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1628"/><stop offset="1" stop-color="#18264b"/></linearGradient>
    <radialGradient id="glow" cx=".78" cy=".5" r=".45"><stop stop-color="#6366f1" stop-opacity=".32"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a6a64"/><stop offset="1" stop-color="#173844"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8090b0" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="520" fill="#101d32"/>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#grid)"/>
  <rect width="1200" height="520" fill="url(#glow)"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="104" font-size="22" font-weight="700" letter-spacing="5" fill="#a5b0ff">AGENTIC SYSTEM</text>
    <text x="62" y="200" font-size="58" font-weight="650" letter-spacing="-1.5" fill="#ffffff">The model changes.</text>
    <text x="62" y="272" font-size="58" font-weight="650" letter-spacing="-1.5" fill="#8ff0cc">The workspace stays.</text>
    <text x="64" y="334" font-size="26" fill="#c7d3e5">Rules, memory and tools, so whichever</text>
    <text x="64" y="368" font-size="26" fill="#c7d3e5">model leads can pick up where I left off.</text>
    <g transform="translate(64 400)">
      <rect width="400" height="64" rx="32" fill="#ffffff" fill-opacity=".08" stroke="#8ff0cc" stroke-opacity=".6" stroke-width="2"/>
      <circle cx="34" cy="32" r="9" fill="#8ff0cc"/>
      <text x="58" y="43" font-size="31" font-weight="650" fill="#e6fff6">I approve what ships</text>
    </g>

    <circle cx="922" cy="262" r="196" fill="none" stroke="#8ea0c4" stroke-opacity=".16" stroke-width="2"/>
    <circle cx="922" cy="262" r="128" fill="none" stroke="#8ea0c4" stroke-opacity=".12" stroke-width="2"/>
    <g stroke="#7f93b8" stroke-opacity=".55" stroke-width="2.5">
      <line x1="775" y1="118" x2="922" y2="262"/>
      <line x1="1068" y1="118" x2="922" y2="262"/>
      <line x1="775" y1="406" x2="922" y2="262"/>
      <line x1="1068" y1="406" x2="922" y2="262"/>
    </g>

    <rect x="812" y="200" width="220" height="124" rx="22" fill="url(#core)" stroke="#78c4b4" stroke-width="2"/>
    <text x="922" y="252" text-anchor="middle" font-size="30" font-weight="650" fill="#ffffff">Shared</text>
    <text x="922" y="290" text-anchor="middle" font-size="30" font-weight="650" fill="#ffffff">workspace</text>

    <g font-size="32" font-weight="650" text-anchor="middle">
      <rect x="690" y="86" width="170" height="64" rx="32" fill="#16294a" stroke="#8b97ff" stroke-width="2"/>
      <text x="775" y="129" fill="#ffffff">Claude</text>
      <rect x="983" y="86" width="170" height="64" rx="32" fill="#16294a" stroke="#8b97ff" stroke-width="2"/>
      <text x="1068" y="129" fill="#ffffff">Codex</text>
      <rect x="690" y="374" width="170" height="64" rx="32" fill="#16294a" stroke="#78c4b4" stroke-width="2"/>
      <text x="775" y="417" fill="#ffffff">Qwen</text>
      <rect x="967" y="374" width="202" height="64" rx="32" fill="#16294a" stroke="#78c4b4" stroke-width="2"/>
      <text x="1068" y="417" fill="#ffffff">Reviewers</text>
    </g>
  </g>
</svg>
