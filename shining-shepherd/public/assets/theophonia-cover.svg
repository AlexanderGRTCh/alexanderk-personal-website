<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Theophonia AI pipeline</title>
  <desc id="desc">Greek audio moves through speech mapping, transcription, grounded translation, passage review, and a release gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1729"/><stop offset="1" stop-color="#17264d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9ca9ff"/><stop offset="1" stop-color="#86e8c4"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8090b0" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="640" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="640" rx="22" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="70" font-size="17" font-weight="700" letter-spacing="3" fill="#9ca9ff">SPEECH AI · TRANSLATION · QUALITY SYSTEMS</text>
    <text x="62" y="151" font-size="72" font-weight="650" letter-spacing="-2" fill="#fff">Theophonia</text>
    <text x="64" y="194" font-size="23" fill="#c7d3e5">A resumable Greek lecture intelligence pipeline</text>

    <g transform="translate(64 256)">
      <rect width="204" height="196" rx="14" fill="#13243e" stroke="#536987"/>
      <text x="20" y="34" font-size="14" font-weight="700" letter-spacing="2" fill="#91a1ff">SOURCE</text>
      <path d="M20 102c18 0 18-44 36-44s18 88 36 88 18-66 36-66 18 44 36 44 18-26 20-26" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
      <text x="20" y="174" font-size="18" font-weight="600" fill="#fff">Greek audio</text>
    </g>

    <g transform="translate(300 256)">
      <rect width="244" height="88" rx="12" fill="#172a47" stroke="#536987"/>
      <text x="18" y="30" font-size="13" font-weight="700" fill="#9ca9ff">01 · COVERAGE</text>
      <text x="18" y="62" font-size="20" font-weight="600" fill="#fff">VAD + Whisper v3</text>
      <rect y="364" width="244" height="88" rx="12" fill="#172a47" stroke="#536987" transform="translate(0 -256)"/>
      <text x="18" y="138" font-size="13" font-weight="700" fill="#9ca9ff">02 · LANGUAGE</text>
      <text x="18" y="170" font-size="20" font-weight="600" fill="#fff">Grounded translation</text>
    </g>

    <g transform="translate(576 256)">
      <rect width="244" height="196" rx="14" fill="#172a47" stroke="#536987"/>
      <text x="20" y="34" font-size="13" font-weight="700" fill="#9ca9ff">03 · PASSAGE AUDIT</text>
      <rect x="20" y="58" width="204" height="24" rx="5" fill="#263b5c"/>
      <rect x="20" y="94" width="164" height="24" rx="5" fill="#263b5c"/>
      <rect x="20" y="130" width="188" height="24" rx="5" fill="#214c4d" stroke="#5a9c91"/>
      <circle cx="207" cy="142" r="5" fill="#86e8c4"/>
      <text x="20" y="180" font-size="16" fill="#b9c7d9">Evidence linked findings</text>
    </g>

    <g transform="translate(852 256)">
      <rect width="284" height="196" rx="14" fill="#173f40" stroke="#65a197"/>
      <text x="22" y="34" font-size="13" font-weight="700" fill="#86e8c4">04 · CONTROLLED OUTPUT</text>
      <text x="22" y="79" font-size="28" font-weight="650" fill="#fff">Repair or hold</text>
      <text x="22" y="112" font-size="17" fill="#c1d7d6">Rerun only affected passages</text>
      <path d="M22 145H262" stroke="#65a197"/>
      <text x="22" y="176" font-size="15" fill="#86e8c4">Fail closed release gate</text>
    </g>

    <path d="M268 354H292M544 354H568M820 354H844" stroke="#9ca9ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M286 348l8 6-8 6M562 348l8 6-8 6M838 348l8 6-8 6" fill="none" stroke="#9ca9ff" stroke-width="3"/>
    <text x="64" y="530" font-size="16" fill="#aebcd0">SQLite task ledger</text>
    <text x="260" y="530" font-size="16" fill="#aebcd0">SHA 256 lineage</text>
    <text x="442" y="530" font-size="16" fill="#aebcd0">Stable passage IDs</text>
    <text x="662" y="530" font-size="16" fill="#aebcd0">Targeted repair</text>
    <circle cx="49" cy="524" r="4" fill="#86e8c4"/><circle cx="245" cy="524" r="4" fill="#86e8c4"/><circle cx="427" cy="524" r="4" fill="#86e8c4"/><circle cx="647" cy="524" r="4" fill="#86e8c4"/>
  </g>
</svg>
