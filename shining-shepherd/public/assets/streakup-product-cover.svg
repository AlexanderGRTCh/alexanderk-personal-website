      <text x="973" y="375" fill="#effaeb" font-size="8" text-anchor="middle">Done</text>
      <rect x="811" y="390" width="83" height="8" rx="4" fill="#f1a928"/>
      <rect x="811" y="409" width="176" height="6" rx="3" fill="#415142"/>
      <rect x="811" y="409" width="18" height="6" rx="3" fill="#91cf8d"/>
