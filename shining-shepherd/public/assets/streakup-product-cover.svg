<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StreakUp habit tracker</title>
  <desc id="desc">StreakUp home and calendar screens on a dark green product cover.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09140d"/>
      <stop offset="0.55" stop-color="#12271a"/>
      <stop offset="1" stop-color="#1f4a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8f0a0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#a8f0a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="26" fill="url(#background)"/>
  <circle cx="1080" cy="110" r="260" fill="url(#glow)"/>
  <circle cx="545" cy="620" r="250" fill="url(#glow)" opacity="0.45"/>
  <path d="M58 558 C202 489 333 552 480 493" fill="none" stroke="#b7e9af" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M48 584 C211 520 350 590 522 526" fill="none" stroke="#b7e9af" stroke-opacity="0.08" stroke-width="2"/>

