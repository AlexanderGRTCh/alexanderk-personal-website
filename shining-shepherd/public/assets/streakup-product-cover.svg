      <circle cx="678" cy="345" r="9" fill="#e7bcc5"/><circle cx="703" cy="345" r="9" fill="#cde9c9"/><circle cx="728" cy="345" r="9" fill="#54ba60"/><circle cx="753" cy="345" r="9" fill="#273127"/><circle cx="778" cy="345" r="9" fill="#d8e9d5"/><circle cx="803" cy="345" r="9" fill="#c7e6c4"/><circle cx="828" cy="345" r="9" fill="#e7bbc4"/>
